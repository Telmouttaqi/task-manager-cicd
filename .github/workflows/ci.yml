name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t task-manager:ci .

      - name: Start container
        run: docker run -d --init --name task-manager-ci -p 127.0.0.1:3001:3000 task-manager:ci

      - name: Check container health
        run: |
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 2 \
            --max-time 5 \
            http://127.0.0.1:3001/health

      - name: Show container logs
        if: always()
        run: |
          if docker container inspect task-manager-ci > /dev/null 2>&1; then
            docker logs task-manager-ci
          fi

      - name: Remove container
        if: always()
        run: |
          if docker container inspect task-manager-ci > /dev/null 2>&1; then
            docker rm -f task-manager-ci
          fi
            - name: Publish tested image
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          IMAGE: ghcr.io/telmouttaqi/task-manager-cicd
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            --username "$GH_USER" \
            --password-stdin

          docker tag task-manager:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"

          echo "Published image: $IMAGE:$GITHUB_SHA"    